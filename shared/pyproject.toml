[project]
name = "shared-auth"
version = "0.1.0"
description = "Shared authentication for NetBridge using Azure CLI credentials"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27.0",
    "cryptography>=50.0.0",
    "aiohttp>=3.14.3",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
]

[tool.pytest.ini_options]
addopts = "--allow-hosts=127.0.0.1,::1,localhost"

[tool.coverage.run]
branch = true
source = ["src/shared_auth"]

[tool.coverage.report]
fail_under = 91
precision = 2
show_missing = true
skip_covered = true
