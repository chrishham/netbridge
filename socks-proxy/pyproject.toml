[project]
name = "netbridge-socks"
version = "0.0.0"  # placeholder — actual version is set by Homebrew formula at install time
description = "SOCKS5 proxy client for NetBridge - runs on laptop to provide browser/kubectl access"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "orjson>=3.11.6",
    "pillow>=11.0.0",
    "PyGObject>=3.50.0; sys_platform == 'linux'",
    "pystray>=0.19.5",
    "shared-auth",
]

[tool.uv.sources]
shared-auth = { path = "../shared" }

[project.scripts]
netbridge-socks = "socks_proxy.__main__:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
]

[tool.pytest.ini_options]
addopts = "--allow-hosts=127.0.0.1,::1,localhost"

[tool.coverage.run]
branch = true
source = ["src/socks_proxy"]

[tool.coverage.report]
fail_under = 54
precision = 2
show_missing = true
skip_covered = true
