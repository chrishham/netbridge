[project]
name = "netbridge-pentest"
version = "1.0.0"
description = "Penetration testing suite for NetBridge"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
