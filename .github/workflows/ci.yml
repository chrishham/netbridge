name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      NETBRIDGE_ALLOWED_TENANTS: "11111111-1111-1111-1111-111111111111"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v5

      - name: Install system dependencies for socks-proxy tray
        run: sudo apt-get update && sudo apt-get install -y libgirepository-2.0-dev libcairo2-dev

      - name: Test shared
        run: |
          cd shared
          uv sync
          uv run pytest

      - name: Test relay
        run: |
          cd relay
          uv sync
          uv run pytest

      - name: Test socks-proxy
        run: |
          cd socks-proxy
          uv sync
          uv run pytest

      - name: Test agent
        run: |
          cd netbridge-agent
          uv sync --group dev
          uv run pytest

  security-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v5

      - name: Install system dependencies for socks-proxy tray
        run: sudo apt-get update && sudo apt-get install -y libgirepository-2.0-dev libcairo2-dev

      - name: Install scanners
        run: |
          uv tool install bandit
          uv tool install pip-audit

      - name: Bandit security scan
        # Suppressed Bandit codes:
        #   B101 (assert_used)          - defensive assertions in non-test code
        #   B104 (hardcoded_bind_all)   - relay intentionally binds 0.0.0.0
        #   B110 (try_except_pass)      - cleanup/shutdown exception swallowing
        #   B404 (import_subprocess)    - needed for az CLI invocation
        #   B603 (subprocess_no_shell)  - safe subprocess with shutil.which paths
        #   B606 (start_process_no_shell) - safe az CLI / OS command spawning
        #   B607 (start_partial_path)   - az CLI resolved via shutil.which()
        run: >
          bandit -r shared/src relay/src socks-proxy/src netbridge-agent/src
          -s B101,B104,B110,B404,B603,B606,B607

      - name: pip-audit shared
        run: |
          cd shared
          uv sync
          uv run pip-audit

      - name: pip-audit relay
        run: |
          cd relay
          uv sync
          uv run pip-audit

      - name: pip-audit socks-proxy
        run: |
          cd socks-proxy
          uv sync
          uv run pip-audit

      - name: pip-audit netbridge-agent
        run: |
          cd netbridge-agent
          uv sync
          uv run pip-audit

  e2e-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v5

      - name: Install system dependencies for socks-proxy tray
        run: sudo apt-get update && sudo apt-get install -y libgirepository-2.0-dev libcairo2-dev

      - name: Sync components
        run: for p in relay netbridge-agent socks-proxy e2e; do (cd "$p" && uv sync); done

      - name: Test the E2E driver
        run: |
          cd e2e
          uv run pytest

      - name: Map the e2e target hostname (remote-DNS check)
        run: echo "$(uv run --project e2e python -m netbridge_e2e.netinfo) netbridge-e2e-target" | sudo tee -a /etc/hosts

      - name: E2E journey (source mode)
        run: >
          uv run --project e2e python -m netbridge_e2e --mode source
          --target-hostname netbridge-e2e-target --work "$RUNNER_TEMP/e2e"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-source-report
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
