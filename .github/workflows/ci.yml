name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release workflows call this so nothing is published without the full suite
  workflow_call:

concurrency:
  # PRs share a group per ref so a new push supersedes the old run; pushes to main get a
  # group per commit, because a pending run in a shared group is cancelled regardless
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      NETBRIDGE_ALLOWED_TENANTS: "11111111-1111-1111-1111-111111111111"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # diff-cover compares against the base branch

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v7

      - name: Install system dependencies for socks-proxy tray
        run: sudo apt-get update && sudo apt-get install -y libgirepository-2.0-dev libcairo2-dev

      - name: Test shared
        if: ${{ !cancelled() }}
        working-directory: shared
        run: uv sync && uv run pytest --cov --cov-report=xml --junitxml=junit.xml

      - name: Test relay
        if: ${{ !cancelled() }}
        working-directory: relay
        run: uv sync && uv run pytest --cov --cov-report=xml --junitxml=junit.xml

      - name: Test socks-proxy
        if: ${{ !cancelled() }}
        working-directory: socks-proxy
        run: uv sync && uv run pytest --cov --cov-report=xml --junitxml=junit.xml

      - name: Test socks-proxy-win
        if: ${{ !cancelled() }}
        working-directory: socks-proxy-win
        run: uv sync && uv run pytest --cov --cov-report=xml --junitxml=junit.xml

      - name: Test agent
        if: ${{ !cancelled() }}
        working-directory: netbridge-agent
        run: uv sync --group dev && uv run pytest --cov --cov-report=xml --junitxml=junit.xml

      - name: Test the E2E driver
        if: ${{ !cancelled() }}
        working-directory: e2e
        run: uv sync && uv run pytest --cov --cov-report=xml --junitxml=junit.xml

      - name: Test the pentest suite
        if: ${{ !cancelled() }}
        working-directory: security-tests
        run: uv sync && uv run pytest -q

      - name: Test the CI scripts
        if: ${{ !cancelled() }}
        run: uv run --no-project --with pytest --with coverage==7.16.2 pytest scripts/tests -q

      - name: Coverage report
        if: ${{ !cancelled() }}
        run: uv run --no-project --with coverage==7.16.2 python scripts/coverage_report.py

      - name: Diff coverage (new and changed lines >= 80%)
        if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('coverage.xml') != '' }}
        env:
          BASE_REF: ${{ github.base_ref }}  # via env, never interpolated into the script
        run: >
          uvx --from diff-cover==10.6.0 diff-cover coverage.xml
          --compare-branch="origin/$BASE_REF" --fail-under=80
          --html-report diff-cover.html --markdown-report diff-cover.md

      - name: Diff coverage summary
        if: ${{ always() && hashFiles('diff-cover.md') != '' }}
        run: cat diff-cover.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-and-junit
          path: |
            */coverage.xml
            */junit.xml
            coverage.xml
            htmlcov/
            diff-cover.html
            diff-cover.md
          if-no-files-found: ignore

  security-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v7

      - name: Install system dependencies for socks-proxy tray
        run: sudo apt-get update && sudo apt-get install -y libgirepository-2.0-dev libcairo2-dev

      - name: Install scanners
        run: |
          uv tool install bandit
          uv tool install pip-audit

      - name: Bandit security scan
        # Suppressed Bandit codes:
        #   B101 (assert_used)          - defensive assertions in non-test code
        #   B104 (hardcoded_bind_all)   - relay intentionally binds 0.0.0.0
        #   B110 (try_except_pass)      - cleanup/shutdown exception swallowing
        #   B404 (import_subprocess)    - needed for az CLI invocation
        #   B603 (subprocess_no_shell)  - safe subprocess with shutil.which paths
        #   B606 (start_process_no_shell) - safe az CLI / OS command spawning
        #   B607 (start_partial_path)   - az CLI resolved via shutil.which()
        run: >
          bandit -r shared/src relay/src socks-proxy/src netbridge-agent/src
          -s B101,B104,B110,B404,B603,B606,B607

      - name: pip-audit shared
        run: |
          cd shared
          uv sync
          uv run pip-audit

      - name: pip-audit relay
        run: |
          cd relay
          uv sync
          uv run pip-audit

      - name: pip-audit socks-proxy
        run: |
          cd socks-proxy
          uv sync
          uv run pip-audit

      - name: pip-audit netbridge-agent
        run: |
          cd netbridge-agent
          uv sync
          uv run pip-audit

  e2e-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v7

      - name: Install system dependencies for socks-proxy tray
        run: sudo apt-get update && sudo apt-get install -y libgirepository-2.0-dev libcairo2-dev

      - name: Sync components
        run: for p in relay netbridge-agent socks-proxy security-tests e2e; do (cd "$p" && uv sync); done

      - name: Map the e2e target hostname (remote-DNS check)
        run: |
          set -euo pipefail
          ip=$(uv run --project e2e python -m netbridge_e2e.netinfo)
          [ -n "$ip" ] && echo "$ip netbridge-e2e-target" | sudo tee -a /etc/hosts

      - name: E2E journey (source mode)
        run: >
          uv run --project e2e python -m netbridge_e2e --mode source
          --target-hostname netbridge-e2e-target --work "$RUNNER_TEMP/e2e"
          --coverage "$RUNNER_TEMP/e2e/coverage"

      - name: E2E coverage summary
        if: always()
        run: |
          f="$RUNNER_TEMP/e2e/coverage/summary.md"
          if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-source-report
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore

  e2e-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v7

      - name: Install system dependencies for socks-proxy tray
        run: sudo apt-get update && sudo apt-get install -y libgirepository-2.0-dev libcairo2-dev

      - name: Sync components
        run: for p in relay netbridge-agent socks-proxy security-tests e2e; do (cd "$p" && uv sync); done

      - name: Map the e2e target hostname (remote-DNS check)
        run: |
          set -euo pipefail
          ip=$(uv run --project e2e python -m netbridge_e2e.netinfo)
          [ -n "$ip" ] && echo "$ip netbridge-e2e-target" | sudo tee -a /etc/hosts

      # same journey, but both clients go through the TLS edge (traefik profile)
      - name: E2E journey (source mode, behind the edge)
        run: >
          uv run --project e2e python -m netbridge_e2e --mode source --edge
          --target-hostname netbridge-e2e-target --work "$RUNNER_TEMP/e2e"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-edge-report
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
