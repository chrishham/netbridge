[project]
name = "netbridge-relay"
version = "0.1.0"
description = "NetBridge relay server - bridges laptop requests to agent"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "httpx>=0.27.0",
    "cryptography>=50.0.0",
    "pyyaml>=6.0",
    "aiolimiter>=1.1.0",
    "shared-auth",
]

[tool.uv.sources]
shared-auth = { path = "../shared" }

[project.scripts]
netbridge-relay = "relay.__main__:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
]

[tool.pytest.ini_options]
addopts = "--allow-hosts=127.0.0.1,::1,localhost"
filterwarnings = ["error::aiohttp.web_exceptions.NotAppKeyWarning"]

[tool.coverage.run]
branch = true
source = ["src/relay"]

[tool.coverage.report]
fail_under = 82
precision = 2
show_missing = true
skip_covered = true
